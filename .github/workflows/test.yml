name: CI Tests

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify module structure
        run: |
          for file in module.json scripts/campaign-planner.mjs styles/campaign-planner.css lang/en.json; do
            if [ ! -f "$file" ]; then
              echo "::error::Missing required file: $file"
              exit 1
            fi
          done
          echo "Module structure verified"

      - name: Validate JSON
        run: |
          node -e "JSON.parse(require('fs').readFileSync('module.json', 'utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('lang/en.json', 'utf8'))"
          echo "module.json and lang/en.json are valid JSON"

      - name: Check script syntax
        run: for file in scripts/*.mjs scripts/apps/*.mjs; do node --check "$file"; done

      - name: Unit tests
        run: npm test
